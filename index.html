<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRARAM — Doranea</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080611;
  color:#fff;
  font-family:Arial,sans-serif;

.app{

}

.logo{

.language{

</head>

<body>

<div class="app">

<header>
  <div class="logo">ASTRARAM</div>
  <div class="tagline">
    Smart Astrology • Personal Guidance
  </div>

  <select id="language" class="language">
    <option value="te-IN">తెలుగు</option>
    <option value="en-IN">English</option>
    <option value="hi-IN">हिन्दी</option>
    <option value="ta-IN">தமிழ்</option>
    <option value="kn-IN">ಕನ್ನಡ</option>
    <option value="ml-IN">മലയാളം</option>
  </select>
</header>

<section class="profile">

  <div class="avatar">🔮</div>

  <div class="name">Doranea</div>

  <div id="status" class="status">
    Ready to talk with you
  </div>

</section>

<div id="chat" class="chat">

  <div class="message ai">
    Namaste 🙏<br><br>
    Nenu Doranea. Mee tho natural ga matladadaniki ready ga unna.
    Mic press chesi mee question adagandi.
  </div>

</div>

<div class="bottom">

  <div id="loading" class="loading">
    Connecting...
  </div>

  <button id="mic" class="mic">
    🎙️
  </button>

  <div class="hint">
    Tap microphone and speak
  </div>

</div>

</div>

<script>

const mic = document.getElementById("mic");
const statusBox = document.getElementById("status");
const loading = document.getElementById("loading");
const chat = document.getElementById("chat");
const language = document.getElementById("language");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;


/* =========================
   MIC BUTTON
========================= */

mic.addEventListener("click", async function(){

  if(listening){
    stopListening();
    return;
  }

  if(!SpeechRecognition){

    addMessage(
      "Mee browser voice recognition support cheyyadam ledu. Android Chrome lo website open chesi try cheyyandi.",
      "ai"
    );

    return;
  }

  /*
    Request microphone permission first.
    This makes the permission flow clearer.
  */

  try{

    if(navigator.mediaDevices &&
       navigator.mediaDevices.getUserMedia){

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      stream.getTracks().forEach(
        track => track.stop()
      );
    }

  }catch(error){

    console.log("Microphone:",error);

    statusBox.innerText =
      "Microphone permission required";

    addMessage(
      "Microphone access allow cheyyandi. Browser site settings lo Microphone → Allow select chesi page ni refresh cheyyandi.",
      "ai"
    );

    return;
  }


  loading.style.display = "block";
  statusBox.innerText = "Connecting...";

  setTimeout(function(){

    loading.style.display = "none";

    startListening();

  },600);

});


/* =========================
   START SPEECH
========================= */

function startListening(){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    language.value;

  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;


  recognition.onstart = function(){

    listening = true;

    mic.classList.add("listening");
    mic.innerHTML = "⏹️";

    statusBox.innerText =
      "Listening... Speak now";
  };


  recognition.onresult = function(event){

    const text =
      event.results[0][0]
      .transcript
      .trim();

    if(!text) return;

    addMessage(text,"user");

    statusBox.innerText =
      "Doranea is thinking...";

    doraneaReply(text);
  };


  recognition.onerror = function(event){

    console.log(event.error);

    resetMic();

    if(event.error === "not-allowed"){

      statusBox.innerText =
        "Microphone permission blocked";

      addMessage(
        "Microphone permission Allow cheyyandi. Chrome → Site settings → Microphone → Allow.",
        "ai"
      );

    }else if(event.error === "no-speech"){

      statusBox.innerText =
        "I didn't hear you";

      addMessage(
        "Mee voice vinapadaledu. Mic press chesi clear ga malli matladandi.",
        "ai"
      );

    }else{

      statusBox.innerText =
        "Ready to talk with you";

    }
  };


  recognition.onend = function(){

    resetMic();

  };


  try{

    recognition.start();

  }catch(error){

    console.log(error);

    resetMic();

  }
}


/* =========================
   STOP
========================= */

function stopListening(){

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}

  }

  resetMic();
}


/* =========================
   RESET MIC
========================= */

function resetMic(){

  listening = false;

  mic.classList.remove("listening");

  mic.innerHTML = "🎙️";
}


/* =========================
   DORANEA
========================= */

function doraneaReply(question){

  const q =
    question.toLowerCase();

  let answer;


  if(
    q.includes("career") ||
    q.includes("job") ||
    q.includes("work") ||
    q.includes("career")
  ){

    answer =
    "Okay... mee career gurinchi matladukundam. Meeru job change gurinchi alochistunnara, leka current job lo growth kavala? Mee birth date, exact birth time, birth place share chesthe traditional astrology perspective lo inka personalized ga discuss cheyyagalanu.";

  }

  else if(
    q.includes("marriage") ||
    q.includes("pelli")
  ){

    answer =
    "Okay... marriage gurinchi chuddam. Mee relationship life lo important decisions ni patience tho teesukovadam useful. Mee birth details unte traditional astrology interpretation tho marriage timing and relationship patterns gurinchi discuss cheyyagalanu.";

  }

  else if(
    q.includes("money") ||
    q.includes("finance") ||
    q.includes("dabbu")
  ){

    answer =
    "Money gurinchi adigaru kada. Financial periods ni traditional astrology lo birth chart ni base cheskoni interpret chestaru. Mee birth date, exact time and place share chesthe aa perspective lo matladukundam.";

  }

  else if(
    q.includes("child") ||
    q.includes("children") ||
    q.includes("kids") ||
    q.includes("pillalu")
  ){

    answer =
    "Children gurinchi kuda discuss cheyyachu. Traditional astrology lo fifth house and related planetary positions ni consider chestaru. Personalized interpretation kosam mee complete birth details kavali.";

  }

  else if(
    q.includes("god") ||
    q.includes("devudu") ||
    q.includes("pooja")
  ){

    answer =
    "Spiritual guidance gurinchi traditional astrology lo chart ni base cheskoni devotional practices suggest chestaru. Idi traditional guidance matrame, guaranteed remedy ani kaadu. Mee birth details share chesthe aa perspective lo discuss cheddam.";

  }

  else{

    answer =
    "Hmm... mee question ardham ayyindi. Nenu meetho natural ga discuss chestanu. Personalized astrology conversation kosam mee name, date of birth, exact birth time and birth place share cheyyandi. Tarvatha meeru career, marriage, money, family, children, past, present or future gurinchi edaina adagochu.";

  }


  setTimeout(function(){

    addMessage(answer,"ai");

    speak(answer);

    statusBox.innerText =
      "Ready for your next question";

  },800);

}


/* =========================
   MESSAGE
========================= */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerText = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

  if(!window.speechSynthesis)
    return;

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang =
    language.value;

  voice.rate = 0.90;
  voice.pitch = 1.02;
  voice.volume = 1;

  speechSynthesis.speak(voice);
}


/* =========================
   LANGUAGE
========================= */

language.addEventListener(
  "change",
  function(){

    let greeting;

    if(this.value === "te-IN"){

      greeting =
      "Namaste 🙏 Nenu Doranea. Telugu lo mee tho natural ga matladadaniki ready ga unna. Mic press chesi mee question adagandi.";

    }else if(this.value === "hi-IN"){

      greeting =
      "Namaste 🙏 Main Doranea hoon. Aap mujhse astrology ke baare mein koi bhi sawaal pooch sakte hain.";

    }else{

      greeting =
      "Hello 🙏 I am Doranea. You can ask me any astrology question naturally using your microphone.";

    }

    addMessage(greeting,"ai");

  }
);

</script>

</body>
</html>
