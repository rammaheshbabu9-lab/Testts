/* NEWS */

function getSavedNews(){

try{

return JSON.parse(
localStorage.getItem("onway_news") || "[]"
);

function getCurrentUser(){

localStorage.getItem("onway_current_user") || "null"

/* ==========================================
   MEDIA DATABASE
========================================== */

let mediaDB=null;

function openMediaDB(){

if(mediaDB){
return mediaDB;
}

mediaDB=new Promise(
function(resolve,reject){

try{

const request=
indexedDB.open(
"OnWayNewsMediaFinal",
1
);

request.onupgradeneeded=
function(event){

const db=
event.target.result;

if(
!db.objectStoreNames.contains(
"media"
)
){

db.createObjectStore(
"media",
{
keyPath:"id"
}
);

}

};

request.onsuccess=
function(){

resolve(
request.result
);

};

request.onerror=
function(){

mediaDB=null;

reject(
request.error ||
new Error(
"Media database unavailable"
)
);

};

}catch(error){

mediaDB=null;

reject(error);

}

});

return mediaDB;

}


/* SAVE MEDIA */

async function saveMediaFile(file){

if(!file){

throw new Error(
"Please select a picture or video."
);

}

const db=
await openMediaDB();

const id=
"m_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2);


return new Promise(
function(resolve,reject){

const tx=
db.transaction(
"media",
"readwrite"
);

const store=
tx.objectStore("media");


const request=
store.put({

id:id,

blob:file,

type:file.type || "",

name:file.name || "media"

});


request.onsuccess=
function(){

};

request.onerror=
function(){

reject(
request.error ||
new Error(
"Could not save media."
)
);

};


tx.oncomplete=
function(){

resolve(id);

};

tx.onerror=
function(){

reject(
tx.error ||
new Error(
"Could not save media."
)
);

};

tx.onabort=
function(){

reject(
tx.error ||
new Error(
"Media save aborted."
)
);

};

});

}


/* GET MEDIA */

async function getMediaFile(id){

if(!id){
return null;
}

const db=
await openMediaDB();

return new Promise(
function(resolve,reject){

const tx=
db.transaction(
"media",
"readonly"
);

const request=
tx.objectStore(
"media"
).get(id);

request.onsuccess=
function(){

if(
request.result
){

resolve(
request.result.blob
);

}else{

resolve(null);

}

};

request.onerror=
function(){

reject(
request.error
);

};

});

}


/* DELETE MEDIA */

async function deleteMediaFile(id){

if(!id)return;

try{

const db=
await openMediaDB();

await new Promise(
function(resolve,reject){

const tx=
db.transaction(
"media",
"readwrite"
);

tx.objectStore(
"media"
).delete(id);

tx.oncomplete=
resolve;

tx.onerror=
function(){

reject(tx.error);

};

});

}catch(error){

console.error(
"Delete media error:",
error
);

}

}


/* ==========================================
   PREVIEW
========================================== */

let previewURL=null;

function previewSelectedMedia(){

const input=
document.getElementById(
"mediaFile"
);

const preview=
document.getElementById(
"filePreview"
);

const content=
document.getElementById(
"previewContent"
);

const fileName=
document.getElementById(
"fileName"
);


content.innerHTML="";
fileName.textContent="";


if(previewURL){

URL.revokeObjectURL(
previewURL
);

previewURL=null;

}


if(
!input.files ||
!input.files.length
){

preview.classList.remove(
"show"
);

return;

}


const file=
input.files[0];


previewURL=
URL.createObjectURL(
file
);


fileName.textContent=
file.name;


if(
file.type.startsWith(
"video/"
)
){

const video=
document.createElement(
"video"
);

video.src=
previewURL;

video.controls=true;

video.playsInline=true;

content.appendChild(
video
);

}else{

const img=
document.createElement(
"img"
);

img.src=
previewURL;

img.alt=
"Selected picture";

content.appendChild(
img
);

}


preview.classList.add(
"show"
);

}


/* ==========================================
   PUBLISH
========================================== */

async function publishNews(){

const user=
getCurrentUser();

if(!user){

closeModal(
"addNewsModal"
);

openModal(
"loginModal"
);

return;

}


const headline=
document.getElementById(
"newsHeadline"
).value.trim();


const location=
document.getElementById(
"newsLocation"
).value;


const matter=
document.getElementById(
"newsMatter"
).value.trim();


const input=
document.getElementById(
"mediaFile"
);


if(!headline){

showToast(
"Enter news headline."
);

return;

}


if(!location){

showToast(
"Select location."
);

return;

}


if(
!input ||
!input.files ||
!input.files.length
){

showToast(
"Please select picture or video."
);

return;

}


if(!matter){

showToast(
"Enter news matter."
);

return;

}


const file=
input.files[0];


const button=
document.getElementById(
"publishBtn"
);


button.disabled=true;

button.textContent=
"Publishing...";


try{

/*
Save actual selected file.
*/

const mediaId=
await saveMediaFile(
file
);


/*
Create news.
*/

const item={

id:
"news_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2),

location:location,

headline:headline,

matter:matter,

mediaId:mediaId,

mediaType:
file.type,

authorPhone:
user.phone,

authorName:
user.name,

createdAt:
Date.now()

};


/*
Save metadata.
*/

const news=
getSavedNews();

news.unshift(item);

saveNews(news);


/*
Clear form.
*/

document.getElementById(
"newsHeadline"
).value="";

document.getElementById(
"newsLocation"
).value="";

document.getElementById(
"newsMatter"
).value="";

input.value="";


if(previewURL){

URL.revokeObjectURL(
previewURL
);

previewURL=null;

}


document.getElementById(
"previewContent"
).innerHTML="";

document.getElementById(
"fileName"
).textContent="";

document.getElementById(
"filePreview"
).classList.remove(
"show"
);


/*
Close and refresh.
*/

closeModal(
"addNewsModal"
);

await renderNews();


showToast(
"News published successfully!"
);


}catch(error){

console.error(
"ONWAY PUBLISH ERROR:",
error
);

let msg=
"Publish failed.";

if(
error &&
error.name ===
"QuotaExceededError"
){

msg=
"Storage full. Please choose a smaller picture.";

}else if(
error &&
error.message
){

msg=
error.message;

}

showToast(
msg
);


}finally{

button.disabled=false;

button.textContent=
"Publish News";

}

}


/* ==========================================
   RENDER
========================================== */

async function renderNews(){

const feed=
document.getElementById(
"newsFeed"
);

feed.innerHTML="";


const uploaded=
getSavedNews();


const all=[
...uploaded,
...defaultNews
];


for(
const item of all
){

const card=
document.createElement(
"article"
);

card.className=
"news-card";


const media=
document.createElement(
"div"
);

media.className=
"news-media";


if(item.mediaId){

try{

const blob=
await getMediaFile(
item.mediaId
);


if(blob){

const url=
URL.createObjectURL(
blob
);


if(
(
blob.type &&
blob.type.startsWith(
"video/"
)
) ||
(
item.mediaType &&
item.mediaType.startsWith(
"video/"
)
)
){

const video=
document.createElement(
"video"
);

video.src=url;

video.controls=true;

video.playsInline=true;

video.preload=
"metadata";

media.appendChild(
video
);

}else{

const img=
document.createElement(
"img"
);

img.src=url;

img.alt=
item.headline;

img.onerror=
function(){

media.innerHTML=
'<div class="media-placeholder">📷</div>';

};

media.appendChild(
img
);

}

}else{

media.innerHTML=
'<div class="media-placeholder">📷</div>';

}

}catch(error){

console.error(
"Media render error:",
error
);

media.innerHTML=
'<div class="media-placeholder">📷</div>';

}

}else if(item.image){

const img=
document.createElement(
"img"
);

img.src=
item.image;

img.alt=
item.headline;

img.onerror=
function(){

media.innerHTML=
'<div class="media-placeholder">📷</div>';

};

media.appendChild(
img
);

}else{

media.innerHTML=
'<div class="media-placeholder">📷</div>';

}


/* CONTENT */

const content=
document.createElement(
"div"
);

content.className=
"news-content";


const liked=
localStorage.getItem(
"liked_"+item.id
)==="true";


content.innerHTML=`

<div class="location">
📍 ${escapeHTML(item.location)}
</div>

<div class="headline">
${escapeHTML(item.headline)}
</div>

<div class="news-matter">
${escapeHTML(item.matter)}
</div>

<div class="news-actions">

<button
class="action-btn like-btn ${liked ? "liked":""}"
onclick="likeNews('${item.id}')">

${liked ? "❤️":"♡"} Like

</button>

<button
class="action-btn"
onclick="shareNews('${item.id}')">

↗ Share

</button>

</div>

`;


card.appendChild(
media
);

card.appendChild(
content
);

feed.appendChild(
card
);

}

}


/* LIKE */

function likeNews(id){

if(!getCurrentUser()){

openModal(
"loginModal"
);

return;

}

const key=
"liked_"+id;

const current=
localStorage.getItem(
key
)==="true";

localStorage.setItem(
key,
current ? "false":"true"
);

renderNews();

}


/* SHARE */

async function shareNews(id){

const uploaded=
getSavedNews();


const item=
uploaded.find(
function(n){
return n.id===id;
}
) ||
defaultNews.find(
function(n){
return n.id===id;
}
);


if(!item)return;


const text=
item.headline+
"\n\n"+
item.matter+
"\n\nOnWay News";


try{

if(navigator.share){

await navigator.share({

title:item.headline,

text:text

});

}else if(
navigator.clipboard
){

await navigator.clipboard.writeText(
text
);

showToast(
"News copied"
);

}else{

showToast(
"Sharing not supported"
);

}

}catch(error){}

}


/* MY NEWS */

function renderMyNews(){

const user=
getCurrentUser();

const list=
document.getElementById(
"myNewsList"
);


if(!user){

list.innerHTML=
'<div style="text-align:center;padding:30px;color:#64748b;">Please login first.</div>';

return;

}


const news=
getSavedNews().filter(
function(item){

return item.authorPhone===
user.phone;

}
);


if(!news.length){

list.innerHTML=`

<div style="
text-align:center;
padding:30px;
color:#64748b;
">

You have not uploaded any news yet.

</div>

`;

return;

}


list.innerHTML="";


news.forEach(
function(item){

const div=
document.createElement(
"div"
);

div.className=
"my-news-item";


div.innerHTML=`

<div class="my-news-title">
${escapeHTML(item.headline)}
</div>

<div class="my-news-location">
📍 ${escapeHTML(item.location)}
</div>

<button
class="delete-news-btn"
onclick="deleteMyNews('${item.id}')">

🗑 Delete News

</button>

`;


list.appendChild(
div
);

}
);

}


/* DELETE NEWS */

async function deleteMyNews(id){

const user=
getCurrentUser();

if(!user)return;


const news=
getSavedNews();


const item=
news.find(
function(n){
return n.id===id;
}
);


if(!item)return;


if(
item.authorPhone !==
user.phone
){

showToast(
"You can delete only your own news."
);

return;

}


if(
!confirm(
"Delete this news permanently?"
)
){

return;

}


if(item.mediaId){

await deleteMediaFile(
item.mediaId
);

}


saveNews(
news.filter(
function(n){
return n.id!==id;
}
)
);


renderMyNews();

await renderNews();


showToast(
"News deleted"
);

}


/* DELETE ACCOUNT */

async function deleteAccount(){

const user=
getCurrentUser();

if(!user)return;


if(
!confirm(
"Delete your account and uploaded news?"
)
){

return;

}


const news=
getSavedNews();


const mine=
news.filter(
function(n){

return n.authorPhone===
user.phone;

}
);


for(
const item of mine
){

if(item.mediaId){

await deleteMediaFile(
item.mediaId
);

}

}


saveNews(
news.filter(
function(n){

return n.authorPhone !==
user.phone;

}
)
);


setCurrentUser(null);

closeModal(
"profileModal"
);

await renderNews();


showToast(
"Account deleted"
);

}


/* ESCAPE */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* OUTSIDE CLICK */

document
.querySelectorAll(
".modal-overlay"
)
.forEach(
function(overlay){

overlay.addEventListener(
"click",
function(event){

if(
event.target===
overlay
){

overlay.classList.remove(
"show"
);

}

}
);

}
);


/* START */

renderNews();

</script>

</html>
